name: Publish to PyPI

# The only path to PyPI. Triggered by publishing a GitHub Release (pre-releases included, so
# v0.1.0a1 works; drafts do not trigger). Order:
#   verify   tag is v<pyproject version>, release commit is on main
#   ci       the full CI workflow on that exact commit; its `build` job makes the distributions
#   publish  uploads exactly those files with PyPI Trusted Publishing (OIDC, no stored token),
#            in the `pypi` environment; PEP 740 attestations are generated by the action
# PyPI trusted publisher: project boxfab, owner boxfab, repository python-sdk,
# workflow publish.yml, environment pypi.

on:
  release:
    types: [published]

permissions: {}

jobs:
  verify:
    # Releases of the other packages (desktop-v*, code-interpreter-v* tags) go through their own workflows.
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag matches the package version
        run: python3 scripts/check_release_tag.py "$TAG"
        env:
          TAG: ${{ github.event.release.tag_name }}
      - name: Release commit is the tag's commit and is on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          [ "$GITHUB_REF" = "refs/tags/$TAG" ] || { echo "ref $GITHUB_REF is not refs/tags/$TAG"; exit 1; }
          tag_commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          [ "$tag_commit" = "$GITHUB_SHA" ] || { echo "tag $TAG -> $tag_commit, workflow SHA $GITHUB_SHA"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main"; exit 1; }
          echo "releasing $TAG at $GITHUB_SHA (on main)"

  ci:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    secrets:
      DIST_EXTRA_DENY: ${{ secrets.DIST_EXTRA_DENY }}

  publish:
    needs: ci
    # One upload at a time across both publish workflows, never cancelled. Set on this job only, so
    # a run that skips (a tag for the other package) never waits in the queue.
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/boxfab/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Files to upload
        run: ls -l dist/ && sha256sum dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
