name: CI

# Runs on pull requests and pushes to main, and is called by publish.yml on the exact release
# commit. Its `build` job produces the only distributions that publish.yml ever uploads.
# The job names below are the required status checks of the `Protect main` ruleset; renaming a
# job means updating the ruleset.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    secrets:
      DIST_EXTRA_DENY:
        required: false

permissions:
  contents: read

env:
  UV_VERSION: "0.11.32"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check boxfab tests_boxfab integration scripts
          uv run ruff format --check tests_boxfab integration scripts examples
      - name: Unit tests (offline; no credentials in this workflow)
        run: uv run pytest tests/test_*.py tests_boxfab -n auto -p no:cacheprovider
      - name: Release tag check rejects malformed tags
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python scripts/check_release_tag.py "v$v"
          for bad in "$v" "v$v-x" "V$v" "v0.0.0"; do
            if python scripts/check_release_tag.py "$bad" 2>/dev/null; then echo "accepted bad tag $bad"; exit 1; fi
          done

  desktop:
    # The boxfab-desktop package in desktop/: offline tests, build, distribution checks, clean
    # install. Its `desktop-dist` artifact is what publish-desktop.yml uploads.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Unit tests (offline; no credentials in this workflow)
        working-directory: desktop
        run: |
          uv sync --locked
          uv run pytest tests/test_client.py tests/test_readiness.py -p no:cacheprovider
      - name: Release tag check
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('desktop/pyproject.toml','rb'))['project']['version'])")
          python scripts/check_release_tag.py --project desktop "desktop-v$v"
          for bad in "v$v" "desktop-$v" "desktop-v$v-x"; do
            if python scripts/check_release_tag.py --project desktop "$bad" 2>/dev/null; then echo "accepted bad tag $bad"; exit 1; fi
          done
      - name: Build
        working-directory: desktop
        run: uv build && uvx twine check --strict dist/*
      - name: Distribution contents, metadata, licenses, secrets
        env:
          DIST_EXTRA_DENY: ${{ secrets.DIST_EXTRA_DENY }}
        run: python scripts/check_dist.py --project desktop desktop/dist
      - name: Install the wheel in a clean environment (core SDK from PyPI)
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install desktop/dist/*.whl
          cd /tmp && /tmp/clean/bin/python -c "import boxfab_desktop, importlib.metadata as m; from boxfab_desktop import Sandbox, BoxFab; print(m.version('boxfab-desktop'), m.version('boxfab'), boxfab_desktop.__file__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-dist
          path: desktop/dist/
          if-no-files-found: error
          retention-days: 90

  code-interpreter:
    # The boxfab-code-interpreter package in code-interpreter/: offline tests, build, distribution checks, clean
    # install. Its `code-interpreter-dist` artifact is what
    # publish-code-interpreter.yml uploads.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Unit tests (offline; no credentials in this workflow)
        working-directory: code-interpreter
        run: |
          uv sync --locked
          uv run pytest tests/test_format_exception.py tests/test_execute_timeout.py tests/test_sandbox_url.py tests/charts/test_deserialize.py -p no:cacheprovider -n 0
      - name: Release tag check
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('code-interpreter/pyproject.toml','rb'))['project']['version'])")
          python scripts/check_release_tag.py --project code-interpreter "code-interpreter-v$v"
          for bad in "v$v" "code-interpreter-$v" "code-interpreter-v$v-x"; do
            if python scripts/check_release_tag.py --project code-interpreter "$bad" 2>/dev/null; then echo "accepted bad tag $bad"; exit 1; fi
          done
      - name: Build
        working-directory: code-interpreter
        run: uv build && uvx twine check --strict dist/*
      - name: Distribution contents, metadata, licenses, secrets
        env:
          DIST_EXTRA_DENY: ${{ secrets.DIST_EXTRA_DENY }}
        run: python scripts/check_dist.py --project code-interpreter code-interpreter/dist
      - name: Install the wheel in a clean environment (core SDK from PyPI)
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install code-interpreter/dist/*.whl
          cd /tmp && /tmp/clean/bin/python -c "import boxfab_code_interpreter as ci, importlib.metadata as m; from boxfab_code_interpreter import Sandbox, BoxFab; print(m.version('boxfab-code-interpreter'), m.version('boxfab'), ci.__file__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-interpreter-dist
          path: code-interpreter/dist/
          if-no-files-found: error
          retention-days: 90

  generated-code-is-in-sync:
    # boxfab/, tests/, desktop/ and code-interpreter/ must be exactly what scripts/sync_upstream.py produces.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python scripts/sync_upstream.py
      - run: git status --porcelain && git diff --exit-code

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Distribution contents, metadata, licenses, secrets
        env:
          DIST_EXTRA_DENY: ${{ secrets.DIST_EXTRA_DENY }}
        run: python scripts/check_dist.py dist
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp && /tmp/clean/bin/python -c "import boxfab, importlib.metadata as m; from boxfab import Sandbox, AsyncSandbox, BoxFab; assert boxfab.ConnectionConfig().domain == 'boxfab.io'; print(m.version('boxfab'), boxfab.__file__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 90

  artifact-roundtrip:
    # Downloads the build artifact with the same action publish.yml uses, and re-checks it, so
    # the upload -> download path of the release is exercised on every change.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - env:
          DIST_EXTRA_DENY: ${{ secrets.DIST_EXTRA_DENY }}
        run: python scripts/check_dist.py dist
