[project]
name = "boxfab"
version = "0.1.0a3"
description = "Python SDK for BoxFab, an agent execution cloud of Firecracker sandboxes"
authors = [{ name = "ContextFab, Inc." }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# Same runtime dependencies and ranges as upstream e2b 2.62.0 (see UPSTREAM.md).
dependencies = [
    "python-dateutil>=2.8.2",
    "wcmatch>=10.1,<12",
    "protobuf-py>=0.6.0,<0.7",
    "httpx>=0.27.0,<1.0.0",
    "h2>=4.4.1,<5",
    "attrs>=23.2.0",
    "packaging>=24.1",
    "typing-extensions>=4.10.0",
    "rich>=14.0.0",
    "connectrpc>=0.12.1,<0.13",
    "pyqwest>=0.12.0,<0.13",
    "e2b-dockerfile-utils>=0.1.0,<0.2",
]

[project.urls]
Repository = "https://github.com/boxfab/python-sdk"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-xdist>=3.3.1,<4",
    "python-dotenv>=1.0.0,<2",
    "pytest-dotenv>=0.5.2,<0.6",
    "pytest-asyncio>=1.3.0,<2",
    "ruff>=0.11.12,<0.12",
    "pytest-timeout>=2.4.0,<3",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["boxfab"]
module-root = ""
source-exclude = ["tests", "integration", "scripts", "examples", ".github", "desktop", "overlay"]
